set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Increase scrollback buffer from 2000 lines
set -g history-limit 10000

# Fix terminal colors (enables true color)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Address vim mode-switching delay (vital if you use Neovim/Vim)
set -s escape-time 0

# -----------------------------------------------------------------------------
# 2. Intuitive Navigation & Splits
# -----------------------------------------------------------------------------
# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split panes using | and - (and preserve current working directory)
unbind '"'
bind '"' split-window -h -c "#{pane_current_path}"
unbind %
bind % split-window -v -c "#{pane_current_path}"

# Switch panes using Alt + vim keys (no prefix needed)
# Switch panes using Alt + vim keys (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# -----------------------------------------------------------------------------
# 3. Quality of Life
# -----------------------------------------------------------------------------
# Quick reload of config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Use vi keys in copy mode (Prefix + [ to enter copy mode)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" # use 'xclip -sel clip' on Linux

# Looks Maxxing
set-option -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"


run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux